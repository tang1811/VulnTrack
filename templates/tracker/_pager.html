{% load ui %}{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="เลือกหน้า">
  <span>แสดง {{ page.start_index }}–{{ page.end_index }} จาก {{ page.paginator.count }} รายการ</span>
  <span class="pages">
    {% if page.has_previous %}<a class="btn btn-secondary btn-sm" href="{% page_url querystring page.previous_page_number %}">ก่อนหน้า</a>{% endif %}
    <span class="btn btn-sm" aria-current="page">หน้า {{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn btn-secondary btn-sm" href="{% page_url querystring page.next_page_number %}">ถัดไป</a>{% endif %}
  </span>
</nav>
{% endif %}
